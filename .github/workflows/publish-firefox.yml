name: Publish to Firefox (AMO)

# Manual only: builds the Firefox extension and submits it to addons.mozilla.org
# via web-ext, then attaches the signed .xpi web-ext downloads to the latest GitHub
# release. There is no push/tag trigger, run it from the Actions tab.
#
# Requires your AMO API credentials from https://addons.mozilla.org/developers/addon/api/key/,
# set under Settings, Secrets and variables, Actions:
#   WEB_EXT_API_KEY     as a repository VARIABLE (the issuer id)
#   WEB_EXT_API_SECRET  as a repository SECRET
#
# It signs whatever version is in wxt.config.ts, so bump that before publishing a
# new version (AMO rejects a version that already exists).
on:
  workflow_dispatch:
    inputs:
      channel:
        description: "AMO channel (listed = public AMO listing, unlisted = self-hosted only); either way the signed xpi is attached to the latest release"
        type: choice
        default: listed
        options:
          - listed
          - unlisted

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Firefox extension
        run: npm run build:firefox

      - name: Sign and submit to AMO
        env:
          # web-ext reads these WEB_EXT_* env vars automatically as --api-key / --api-secret.
          # Key is a repo variable, secret is a repo secret.
          WEB_EXT_API_KEY: ${{ vars.WEB_EXT_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.WEB_EXT_API_SECRET }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          if [ -z "${WEB_EXT_API_KEY:-}" ] || [ -z "${WEB_EXT_API_SECRET:-}" ]; then
            echo "::error::Missing WEB_EXT_API_KEY / WEB_EXT_API_SECRET repo secrets."
            exit 1
          fi
          args=(--source-dir=.output/firefox-mv2 --channel="$CHANNEL")
          # Listing metadata (license/category/summary) is only needed for a listed submission.
          if [ "$CHANNEL" = "listed" ]; then
            args+=(--amo-metadata=amo-metadata.json)
          fi
          npx --yes web-ext sign "${args[@]}"

      - name: Attach signed XPI to the latest GitHub release
        # web-ext downloads the signed .xpi for both channels. Rename it to the repo's artifact
        # scheme (DExtV2-Resurrect-firefox-<version>.xpi, matching the zips) and attach it to the
        # newest release for people who prefer to install from GitHub instead of AMO. --clobber
        # lets a re-run replace an asset of the same name.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          xpis=( web-ext-artifacts/*.xpi )
          if [ ${#xpis[@]} -eq 0 ]; then
            echo "::warning::No signed .xpi was produced; nothing to attach."
            exit 0
          fi
          version="$(jq -r .version .output/firefox-mv2/manifest.json)"
          asset="DExtV2-Resurrect-firefox-${version}.xpi"
          cp "${xpis[0]}" "$asset"
          tag="$(gh release view --json tagName --jq .tagName 2>/dev/null || true)"
          if [ -z "$tag" ]; then
            echo "::error::No GitHub release found to attach the XPI to; create a release first."
            exit 1
          fi
          echo "Attaching $asset to the latest release: $tag"
          gh release upload "$tag" "$asset" --clobber
